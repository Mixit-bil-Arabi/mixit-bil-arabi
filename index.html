<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mixit Bil Arabi: community song-building platform and record label for the Middle East. Clickable prototype.">
<title>Mixit Bil Arabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
/* Layout: dark violet-to-teal studio rail on the side, light lavender-to-ice workspace; every song is a tree of layers. */
:root{
  --deep-a:#24104F; --deep-b:#0F0B24; --deep-c:#072A3C;
  --on-deep:#F4F0FF; --on-deep-muted:#B9B0DA; --deep-line:rgba(255,255,255,.12);
  --bg:#F8F6FF; --bg-2:#EEF4FB; --surface:#FFFFFF; --surface-2:#F4F1FD; --line:#E3DEF3;
  --fg:#1B1433; --muted:#665F80; --soft:#8D86A8;
  --violet:#7C3AED; --pink:#E0559B; --cyan:#0EA5C4; --amber:#D98A0B; --green:#16A34A; --red:#DC2626;
  --pink-hi:#FF7AB8; --cyan-hi:#22D3EE; --violet-hi:#A78BFA;
  --c-beat:var(--violet); --c-lyric:var(--pink); --c-melody:var(--cyan); --c-instrument:var(--amber);
  --tint-beat:#EFE7FF; --tint-lyric:#FDE8F2; --tint-melody:#E1F6FB; --tint-instrument:#FBF0DC;
  --shadow:0 1px 2px rgba(36,16,79,.06),0 8px 24px rgba(36,16,79,.07);
  --f-head:'Rubik','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'DM Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0A20; --bg-2:#0A1A26; --surface:#18122F; --surface-2:#1F1840; --line:#2E2654;
  --fg:#EFEAFF; --muted:#A79FC8; --soft:#7F77A3;
  --violet:#A78BFA; --pink:#FF7AB8; --cyan:#22D3EE; --amber:#F5B94A; --green:#4ADE80; --red:#F87171;
  --tint-beat:#2A1E52; --tint-lyric:#3A1A33; --tint-melody:#0F2E3B; --tint-instrument:#33260F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0A20; --bg-2:#0A1A26; --surface:#18122F; --surface-2:#1F1840; --line:#2E2654;
  --fg:#EFEAFF; --muted:#A79FC8; --soft:#7F77A3;
  --violet:#A78BFA; --pink:#FF7AB8; --cyan:#22D3EE; --amber:#F5B94A; --green:#4ADE80; --red:#F87171;
  --tint-beat:#2A1E52; --tint-lyric:#3A1A33; --tint-melody:#0F2E3B; --tint-instrument:#33260F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);background-image:linear-gradient(160deg,var(--bg) 0%,var(--bg-2) 100%);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.1}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-head);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .eyebrow{letter-spacing:0}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.app.gate{grid-template-columns:minmax(0,1fr)}
.app.gate .side,.app.gate .topbar{display:none}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:24px 16px;background:linear-gradient(170deg,var(--deep-a) 0%,var(--deep-b) 55%,var(--deep-c) 100%);color:var(--on-deep);overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--on-deep);text-decoration:none;padding-inline:8px}
.logo small{display:block;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-deep-muted)}
.logo-mark{display:flex;align-items:flex-end;gap:3px;height:26px}
.logo-mark i{display:block;width:4px;border-radius:2px;background:linear-gradient(180deg,#FF7AB8,#22D3EE)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--on-deep-muted);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:rgba(255,255,255,.06);color:var(--on-deep)}
.nav a.on{background:rgba(255,255,255,.11);color:var(--on-deep)}
.nav a.on svg{color:#FF7AB8}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.side-wave{position:absolute;inset:auto 0 0 0;height:140px;opacity:.5;pointer-events:none}
.me-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);color:var(--on-deep);text-decoration:none}
.me-card b{display:block;font-size:14px}
.me-card span{font-size:12px;color:var(--on-deep-muted)}
.lang-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--deep-line);background:transparent;color:var(--on-deep);cursor:pointer;font-weight:500}
.lang-btn:hover{background:rgba(255,255,255,.08)}
.topbar{display:none}
main{min-width:0;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.btn svg{width:16px;height:16px}
.btn.primary{background:linear-gradient(120deg,#7C3AED,#C04FD6 55%,#FF7AB8);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg);flex:none}
.icon-btn svg{width:16px;height:16px}
.icon-btn.play{background:var(--fg);color:var(--surface);border-color:transparent}
.icon-btn.play.on{background:linear-gradient(135deg,#7C3AED,#22D3EE);color:#fff}
.like{display:inline-flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;padding:6px 8px;border-radius:999px}
.like svg{width:16px;height:16px}
.like.on{color:var(--pink)}
.like.on svg{fill:currentColor}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.beat{background:var(--tint-beat);color:var(--c-beat)}
.tag.lyric{background:var(--tint-lyric);color:var(--c-lyric)}
.tag.melody{background:var(--tint-melody);color:var(--c-melody)}
.tag.instrument{background:var(--tint-instrument);color:var(--c-instrument)}
.tag.plain{background:var(--surface-2);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-rising{color:var(--cyan)} .st-review{color:var(--amber)} .st-offer{color:var(--violet)} .st-signed{color:var(--green)} .st-open{color:var(--muted)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--f-head);font-weight:600;font-size:12px;color:#fff;flex:none}
.av.lg{width:72px;height:72px;font-size:26px}
.avs{display:flex}
.avs .av{border:2px solid var(--surface);margin-inline-start:-8px}
.avs .av:first-child{margin-inline-start:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;color:var(--fg)}
.chip.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:600}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
textarea.input{min-height:110px;resize:vertical;line-height:1.7}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hint{font-size:12px;color:var(--muted)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-head p{color:var(--muted);max-width:62ch}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;accent-color:var(--violet);width:16px;height:16px;flex:none}
input[type=range]{accent-color:var(--violet);width:100%}

/* waveform */
.wave{display:flex;align-items:center;gap:2px;height:40px}
.wave i{flex:1;border-radius:2px;background:currentColor;opacity:.55;min-width:2px}
.playing .wave i{opacity:.95}
.lyric-snip{font-size:15px;line-height:1.9;color:var(--fg);font-family:var(--f-body);min-height:40px;direction:rtl;text-align:right}

/* piece card */
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.piece{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.piece .title{font-family:var(--f-head);font-weight:600;font-size:16px;line-height:1.25}
.piece .by{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);text-decoration:none}
.piece .by:hover b{color:var(--violet)}
.piece .by b{color:var(--fg);font-weight:600}
.piece .meta{color:var(--muted)}
.piece .actions{display:flex;align-items:center;gap:6px;margin-top:auto}
.piece .actions .btn{margin-inline-start:auto}
.c-beat{color:var(--c-beat)} .c-lyric{color:var(--c-lyric)} .c-melody{color:var(--c-melody)} .c-instrument{color:var(--c-instrument)}

/* hero bands */
.band{position:relative;overflow:hidden;border-radius:20px;padding:28px;background:linear-gradient(125deg,var(--deep-a) 0%,var(--deep-b) 55%,var(--deep-c) 100%);color:var(--on-deep);display:flex;flex-direction:column;gap:14px}
.band .muted,.band .eyebrow{color:var(--on-deep-muted)}
.band canvas{position:absolute;inset:auto 0 0 0;width:100%;height:120px;opacity:.55;pointer-events:none}
.band > *:not(canvas){position:relative}
.band .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--on-deep)}
.band .btn.primary{background:linear-gradient(120deg,#7C3AED,#C04FD6 55%,#FF7AB8);border-color:transparent;color:#fff}
.band .icon-btn.play{background:#fff;color:#24104F}
.band .like{color:var(--on-deep-muted)} .band .like.on{color:#FF7AB8}
.band .pill{border-color:rgba(255,255,255,.2);color:var(--on-deep)}
.band .pill.st-rising .dot{background:#22D3EE}.band .pill.st-review .dot{background:#F5B94A}.band .pill.st-offer .dot{background:#A78BFA}.band .pill.st-signed .dot{background:#4ADE80}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-head);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--on-deep-muted)}

/* trending songs */
.songs-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.song-card{padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-decoration:none;color:var(--fg);min-width:0}
.song-card:hover{border-color:var(--violet)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack i{display:block;height:6px;border-radius:3px}

/* gate */
.gate-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.gate-hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--deep-a) 0%,var(--deep-b) 55%,var(--deep-c) 100%);color:var(--on-deep);padding-block:48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;gap:26px;justify-content:center}
.gate-hero h1{font-size:clamp(38px,6vw,68px);font-weight:800;letter-spacing:-.03em;max-width:12ch}
.gate-hero h1 em{font-style:normal;background:linear-gradient(90deg,#FF7AB8,#A78BFA,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-hero p{color:var(--on-deep-muted);font-size:17px;max-width:46ch}
.gate-hero canvas{position:absolute;inset:auto 0 0 0;width:100%;height:220px;pointer-events:none}
.gate-hero > *:not(canvas){position:relative}
.gate-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:620px}
.gate-steps div{border:1px solid var(--deep-line);border-radius:12px;padding:12px;font-size:13px;color:var(--on-deep-muted);background:rgba(255,255,255,.04)}
.gate-steps b{display:block;color:var(--on-deep);font-family:var(--f-head);font-weight:600;font-size:14px;margin-bottom:2px}
.gate-form{display:flex;align-items:center;justify-content:center;padding-block:48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.gate-form .panel{width:100%;max-width:440px;padding:28px}
.code-input{font-family:var(--f-mono);font-size:18px;letter-spacing:.08em;text-transform:uppercase;text-align:center;direction:ltr}
.err{color:var(--red);font-size:13px}
.gate-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gate-top .lang-btn{border-color:var(--deep-line)}

/* tree */
.tree-box{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px}
.tree-box svg{display:block}
.tn rect.bg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.tn{cursor:pointer}
.tn:hover rect.bg{stroke:var(--violet)}
.tn.in rect.bg{stroke:var(--violet);stroke-width:2}
.tn.sel rect.bg{fill:var(--tint-beat)}
.tn text{fill:var(--fg);font-family:var(--f-body);font-size:12px}
.tn text.t{font-family:var(--f-head);font-weight:600;font-size:13px}
.tn text.s{fill:var(--muted);font-size:11px}
.tn text.p{fill:var(--violet);font-family:var(--f-mono);font-size:11px;font-weight:500}
.tn .bar-beat{fill:var(--c-beat)} .tn .bar-lyric{fill:var(--c-lyric)} .tn .bar-melody{fill:var(--c-melody)} .tn .bar-instrument{fill:var(--c-instrument)}
.edge{fill:none;stroke:var(--line);stroke-width:2}
.edge.in{stroke:var(--violet);stroke-width:2.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.song-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.layers{display:flex;flex-direction:column;gap:8px}
.layer{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.layer.muted-l{opacity:.5}
.layer .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .sb{font-size:12px;color:var(--muted)}
.tog{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:600;cursor:pointer}
.tog.on{background:var(--fg);color:var(--surface)}
.split-table{width:100%;border-collapse:collapse;font-size:14px}
.split-table td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.split-table td:last-child{text-align:end;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.split-table tr.new td{color:var(--violet);font-weight:600}
.split-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.split-bar i{display:block;height:100%}
.note{font-size:13px;color:var(--muted);padding:12px;border-radius:10px;background:var(--surface-2);line-height:1.55}
.lyrics{white-space:pre-line;direction:rtl;text-align:right;font-size:16px;line-height:2}
.lyrics-tr{white-space:pre-line;font-size:13px;color:var(--muted);font-style:italic}

/* match */
.match-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.slot{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.slot.seed{border-style:dashed}
.score{display:flex;align-items:center;gap:10px}
.ring{--p:80;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--violet) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface);font-family:var(--f-mono);font-size:13px}
.reasons{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.reasons li{display:flex;gap:6px;align-items:flex-start}
.reasons li svg{width:14px;height:14px;color:var(--green);flex:none;margin-top:3px}
.scan{height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--violet),var(--cyan),transparent);background-size:200% 100%;animation:scan 1s linear infinite}
@keyframes scan{to{background-position:-200% 0}}

/* A&R */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px;border-bottom:2px solid currentColor}
.col-head h3{font-size:14px;color:var(--fg)}
.ar-card{padding:14px;display:flex;flex-direction:column;gap:10px}
.sig{display:flex;align-items:center;gap:10px}
.sig .meter{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.sig .meter i{display:block;height:100%;background:linear-gradient(90deg,#7C3AED,#FF7AB8)}
.sig b{font-family:var(--f-mono);font-size:14px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:12px;color:var(--muted)}
.kv b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.spark{width:100%;height:30px;display:block}
.spark path.l{fill:none;stroke:var(--cyan);stroke-width:1.75}
.spark path.a{fill:var(--tint-melody)}
.spark circle{fill:var(--cyan)}

/* profile */
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-color:var(--violet)}
.list{display:flex;flex-direction:column;gap:8px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.list-row .grow{flex:1;min-width:160px}

/* upload */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg button{padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px}
.seg button svg{width:22px;height:22px}
.seg button.on{border-color:currentColor;border-width:2px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;background:var(--surface-2)}
.drop:hover{border-color:var(--violet)}
.drop input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.proof{font-family:var(--f-mono);font-size:12px;word-break:break-all;padding:12px;border-radius:10px;background:var(--surface-2);direction:ltr;text-align:left}
.up-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}

/* player, modal, toast */
.player{position:fixed;inset:auto 0 0 248px;z-index:30;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(90deg,var(--deep-a),var(--deep-b) 60%,var(--deep-c));color:var(--on-deep);display:flex;align-items:center;gap:14px;box-shadow:0 -8px 30px rgba(15,11,36,.25)}
[dir="rtl"] .player{inset:auto 248px 0 0}
.app.gate ~ .player{inset-inline:0}
.player canvas{width:96px;height:32px;flex:none}
.player .pi{min-width:0;flex:1}
.player .pi b{display:block;font-family:var(--f-head);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .pi span{font-size:12px;color:var(--on-deep-muted)}
.player .icon-btn{background:#fff;color:#24104F;border:0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,11,36,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:start;background:var(--surface);width:100%}
.opt:hover,.opt.on{border-color:var(--violet)}
.opt.on{background:var(--tint-beat)}
.opt b{display:block;font-size:14px}
.opt span{font-size:13px;color:var(--muted)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.demo-flag{font-size:11px;color:var(--on-deep-muted);padding-inline:8px;line-height:1.4}

@media (max-width:1000px){
  .song-grid,.match-grid,.up-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;z-index:40;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:0}
  .side .logo,.side .side-foot,.side .side-wave,.side .demo-flag{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between}
  .nav a{flex-direction:column;gap:3px;padding:6px 4px;font-size:10.5px;flex:1;text-align:center;align-items:center}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(120deg,var(--deep-a),var(--deep-b) 60%,var(--deep-c));position:sticky;top:env(safe-area-inset-top,0px);z-index:35}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep-a)}
  .player,[dir="rtl"] .player{inset:auto 0 calc(62px + env(safe-area-inset-bottom,0px)) 0;padding-block:8px}
  main{padding-block:20px 150px}
  .gate-wrap{grid-template-columns:minmax(0,1fr)}
  .gate-hero{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:32px 120px}
  .gate-steps{grid-template-columns:minmax(0,1fr)}
  .grid-2,.grid-3{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:repeat(4,minmax(250px,80vw))}
  .band{padding:20px}
  .stats{gap:18px}
}
@media (max-width:520px){ .seg{grid-template-columns:repeat(2,minmax(0,1fr))} .layer{grid-template-columns:auto minmax(0,1fr) auto} .layer .tog{grid-column:3} .layer .icon-btn{display:none} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

function fresh(){return{lang:'en',me:null,pieces:JSON.parse(JSON.stringify(SEED_PIECES)),songs:JSON.parse(JSON.stringify(SEED_SONGS)),liked:[],sel:{},filter:{type:'all',dialect:'any',mood:'any',q:''},tab:'pieces'}}

function save(){try{const c=Object.assign({},S,{pieces:S.pieces.map(p=>{const q=Object.assign({},p);delete q.fileUrl;return q})});localStorage.setItem(STORE,JSON.stringify(c))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=k=>(I18N[S.lang]&&I18N[S.lang][k])??I18N.en[k]??k;
const L=o=>o?(typeof o==='string'?o:(o[S.lang]||o.en)):'';
const loc=()=>S.lang==='ar'?'ar-AE-u-nu-latn':'en-US';
const n=v=>new Intl.NumberFormat(loc(),{notation:v>=10000?'compact':'standard',maximumFractionDigits:1}).format(v);
const pct=v=>new Intl.NumberFormat(loc(),{style:'percent',maximumFractionDigits:1}).format(v);
const dateF=d=>new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short'}).format(new Date(d));
function creators(){const c=Object.assign({},SEED_CREATORS);if(S.me)c.me={name:{en:S.me.name,ar:S.me.name},city:S.me.city,roles:S.me.roles,hue:8,bio:{en:T('new_creator'),ar:I18N.ar.new_creator},joined:S.me.joined};return c}
const C=id=>creators()[id]||{name:{en:'?'},city:'dubai',roles:[],hue:0};
const P=id=>S.pieces.find(p=>p.id===id);
const SG=id=>S.songs.find(s=>s.id===id);
function initials(name){return name.split(/[\s-]+/).filter(Boolean).slice(0,2).map(w=>w.replace(/^ال(?=..)/,'')[0]).join('').toUpperCase()}
function av(id,cls=''){const c=C(id);return `<span class="av ${cls}" style="background:${HUES[c.hue%HUES.length]}" title="${esc(L(c.name))}">${esc(initials(L(c.name)))}</span>`}
function typeLabel(p){return p.type==='instrument'&&p.inst?T('i_'+p.inst):T('t_'+p.type)}
function tag(p){return `<span class="tag ${p.type}">${typeLabel(p)}</span>`}
function metaLine(p){return `${p.bpm} ${T('bpm')} · ${p.key} ${T('s_'+p.scale)} · ${T('d_'+p.dialect)}`}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function waveBars(seed,count=46){const r=mulberry(seed*7+3);let out='';for(let i=0;i<count;i++){const env=Math.sin(Math.PI*i/count)*.6+.4;const h=Math.max(10,Math.round((r()*.7+.3)*env*100));out+=`<i style="height:${h}%"></i>`}return `<div class="wave">${out}</div>`}
function isLiked(k){return S.liked.includes(k)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
function stagePill(st){return `<span class="pill st-${st}"><span class="dot"></span>${T('st_'+st)}</span>`}
function pathTag(p){return `<span class="tag plain">${p==='ai'?IC.match.replace('<svg','<svg width="13" height="13"'):IC.branch.replace('<svg','<svg width="13" height="13"')}${T('p_'+p)}</span>`}

/* song maths */
function pathTo(song,nodeId){const out=[];let cur=song.nodes.find(x=>x.id===nodeId);while(cur){out.unshift(cur);cur=song.nodes.find(x=>x.id===cur.parent)}return out}
function splits(path){let arr=[];path.forEach((nd,i)=>{const p=P(nd.piece);if(i===0){arr=[{node:nd.id,by:p.by,piece:p.id,pct:1}]}else{arr.forEach(a=>a.pct*=(1-nd.share));arr.push({node:nd.id,by:p.by,piece:p.id,pct:nd.share})}});return arr}
function leadNode(song){return song.nodes.reduce((a,b)=>b.likes>=a.likes?b:a)}
function songLikes(song){return song.nodes.reduce((s,x)=>s+x.likes+(isLiked(song.id+':'+x.id)?1:0),0)}
function songCreators(song){return [...new Set(song.nodes.map(x=>P(x.piece).by))]}
function signal(song){
  const likes=songLikes(song),lead=pathTo(song,leadNode(song).id),types=new Set(lead.map(x=>P(x.piece).type));
  const g=song.growth,gr=g[0]?(g[g.length-1]-g[0])/g[0]:0;
  const parts={likes:Math.min(35,Math.log10(likes+1)*9),plays:Math.min(20,Math.log10(song.plays+1)*4),remix:Math.min(15,song.nodes.length*2.5),growth:Math.min(15,gr*10),complete:(types.has('beat')&&types.has('lyric')&&types.has('melody'))?15:types.size*4};
  const total=Math.round(Object.values(parts).reduce((a,b)=>a+b,0));
  return{total:Math.min(99,total),gr,parts};
}

/* ---------------- audio engine ---------------- */
const Engine=(()=>{
  let ctx,master,analyser,noiseBuf,timer=null,session=null,cur=null;
  function init(){
    if(ctx)return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    master=ctx.createGain();master.gain.value=.7;master.connect(comp);
    analyser=ctx.createAnalyser();analyser.fftSize=64;analyser.smoothingTimeConstant=.75;
    comp.connect(analyser);analyser.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
  function kick(t,dest,v=.9,f0=150,f1=42,d=.28){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+.13);env(g,t,.002,v,d);o.connect(g).connect(dest);o.start(t);o.stop(t+d+.1)}
  function noise(t,dest,{type='highpass',f=7000,q=1,v=.2,d=.04}={}){const s=ctx.createBufferSource();s.buffer=noiseBuf;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ctx.createGain();env(g,t,.001,v,d);s.connect(fl).connect(g).connect(dest);s.start(t,Math.random()*.5);s.stop(t+d+.05)}
  function tone(t,freq,dur,dest,{wave='sine',v=.15,a=.005,cut=0,cutEnd=0,vib=0,q=1}={}){
    const o=ctx.createOscillator();o.type=wave;o.frequency.setValueAtTime(freq,t);let node=o;
    if(vib){const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=5.4;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(vib,t+Math.min(.25,dur));l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+a+dur+.1)}
    if(cut){const f=ctx.createBiquadFilter();f.type='lowpass';f.Q.value=q;f.frequency.setValueAtTime(cut,t);if(cutEnd)f.frequency.exponentialRampToValueAtTime(cutEnd,t+dur);o.connect(f);node=f}
    const g=ctx.createGain();env(g,t,a,v,dur);node.connect(g).connect(dest);o.start(t);o.stop(t+a+dur+.1);
  }
  const freqOf=(root,scale,deg)=>{const s=SCALES[scale]||SCALES.hijaz;const o=Math.floor(deg/7),i=((deg%7)+7)%7;return root*Math.pow(2,(s[i]+12*o)/12)};
  function phrase(seed,density,maxLen=3,range=7){
    const r=mulberry(seed);const bar=[];let st=0;
    while(st<16){if(r()<density){const len=1+Math.floor(r()*maxLen);bar.push({step:st,deg:Math.floor(r()*range)-1,len});st+=len}else st++}
    const second=bar.map(x=>Object.assign({},x,{step:x.step+16})).filter(x=>x.step<28);
    second.push({step:28,deg:0,len:4});
    return bar.concat(second);
  }
  const BEATS={
    trap:{k:[0,7,10,16,23,26],s:[8,24],h:'2',roll:true,bass:true},
    afro:{k:[0,6,10,16,22,26],s:[],rim:[4,12,20,28,14],h:'off',shaker:true,bass:true},
    rnb:{k:[0,10,16,19,26],s:[8,24],h:'2soft',bass:true},
    khaleeji:{k:[0,6,10,16,22,26],s:[],clap:[4,12,14,20,28,30],h:'2soft',bass:true},
  };
  /* each layer: schedule one 2-bar loop (32 sixteenths) at t0 */
  function layer(p,t0,sd,root,scale,dest){
    if(p.type==='beat'){
      const b=BEATS[p.style]||BEATS.trap;
      b.k.forEach(s=>{kick(t0+s*sd,dest);if(b.bass)tone(t0+s*sd,root/2,sd*2.6,dest,{wave:'sine',v:.32,a:.004})});
      (b.s||[]).forEach(s=>{noise(t0+s*sd,dest,{type:'bandpass',f:1800,q:.7,v:.45,d:.16});tone(t0+s*sd,190,.08,dest,{wave:'triangle',v:.12})});
      (b.rim||[]).forEach(s=>noise(t0+s*sd,dest,{type:'bandpass',f:3200,q:4,v:.35,d:.05}));
      (b.clap||[]).forEach(s=>[0,.012,.024].forEach(o=>noise(t0+s*sd+o,dest,{type:'bandpass',f:1300,q:1,v:.28,d:.09})));
      for(let s=0;s<32;s++){
        if(b.h==='2'&&s%2===0)noise(t0+s*sd,dest,{v:.13});
        if(b.h==='2soft'&&s%2===0)noise(t0+s*sd,dest,{v:.07});
        if(b.h==='off'&&s%4===2)noise(t0+s*sd,dest,{v:.14,d:.07});
        if(b.shaker)noise(t0+s*sd,dest,{f:9000,v:s%2?.03:.06,d:.03});
      }
      if(b.roll)for(let s=28;s<32;s+=.5)noise(t0+s*sd,dest,{v:.08,d:.025});
    }else if(p.type==='melody'){
      phrase(p.seed,.55,3,8).forEach(x=>tone(t0+x.step*sd,freqOf(root*2,scale,x.deg),x.len*sd*.95,dest,{wave:'sawtooth',v:.075,a:.03,cut:2000,vib:4}));
    }else if(p.type==='lyric'){
      /* vocal guide: a soft hummed contour under the words */
      phrase(p.seed,.4,4,5).forEach(x=>tone(t0+x.step*sd,freqOf(root*2,scale,x.deg+2),x.len*sd,dest,{wave:'triangle',v:.06,a:.06,cut:1100,vib:3}));
      [0,16].forEach(s=>{tone(t0+s*sd,freqOf(root,scale,0),16*sd*.95,dest,{wave:'sine',v:.035,a:.4});tone(t0+s*sd,freqOf(root,scale,4),16*sd*.95,dest,{wave:'sine',v:.025,a:.4})});
    }else if(p.inst==='oud'){
      phrase(p.seed,.7,2,9).forEach(x=>{const f=freqOf(root,scale,x.deg);tone(t0+x.step*sd,f,.45,dest,{wave:'sawtooth',v:.14,a:.002,cut:3200,cutEnd:420,q:2});if(x.len>1)tone(t0+(x.step+1)*sd,f,.3,dest,{wave:'sawtooth',v:.08,a:.002,cut:2600,cutEnd:400,q:2})});
    }else if(p.inst==='qanun'){
      const r=mulberry(p.seed);for(let s=0;s<32;s++){if(r()<.62){const deg=Math.floor(r()*9);const f=freqOf(root*2,scale,deg);tone(t0+s*sd,f,.3,dest,{wave:'triangle',v:.08,a:.002});tone(t0+s*sd,f*2,.15,dest,{wave:'sine',v:.025,a:.002})}}
    }else if(p.inst==='perc'){
      [0,3,8,16,19,24].forEach(s=>kick(t0+s*sd,dest,.55,120,62,.2));
      [4,6,12,14,20,22,28,30].forEach(s=>noise(t0+s*sd,dest,{type:'bandpass',f:2400,q:2,v:.22,d:.06}));
      [8,24,26].forEach(s=>[0,.01,.022].forEach(o=>noise(t0+s*sd+o,dest,{type:'bandpass',f:1200,q:.9,v:.3,d:.1})));
    }else if(p.inst==='bass'){
      phrase(p.seed,.35,3,4).forEach(x=>tone(t0+x.step*sd,freqOf(root/2,scale,x.deg),x.len*sd*.9,dest,{wave:'sine',v:.3,a:.005}));
    }
  }
  function stop(){
    if(timer){clearInterval(timer);timer=null}
    if(session){const g=session;g.gain.setTargetAtTime(0,ctx.currentTime,.03);setTimeout(()=>{try{g.disconnect()}catch(e){}},300);session=null}
    cur=null;UI.onStop();
  }
  /* spec: {key, title, sub, bpm, root, scale, pieces:[piece], file?} */
  function play(spec){
    init();ctx.resume();stop();
    cur=spec;session=ctx.createGain();session.connect(master);
    spec.gains=spec.pieces.map(()=>{const g=ctx.createGain();g.connect(session);return g});
    (spec.muted||[]).forEach(i=>{if(spec.gains[i])spec.gains[i].gain.value=0});
    const sd=60/spec.bpm/4,loop=32*sd;let next=ctx.currentTime+.08;
    const fileIdx=spec.pieces.findIndex(p=>FILES[p.id]&&FILES[p.id].buf);
    spec.pieces.forEach((p,i)=>{if(FILES[p.id]&&FILES[p.id].buf){const src=ctx.createBufferSource();src.buffer=FILES[p.id].buf;src.loop=true;src.connect(spec.gains[i]);src.start(next)}});
    const tick=()=>{while(next<ctx.currentTime+.35){spec.pieces.forEach((p,i)=>{if(!(FILES[p.id]&&FILES[p.id].buf))layer(p,next,sd,spec.root,spec.scale,spec.gains[i])});next+=loop}};
    tick();timer=setInterval(tick,80);
    UI.onPlay(spec);
  }
  function setMute(i,m){if(cur&&cur.gains&&cur.gains[i])cur.gains[i].gain.setTargetAtTime(m?0:1,ctx.currentTime,.02)}
  async function decode(file){init();const ab=await file.arrayBuffer();return await ctx.decodeAudioData(ab)}
  return{play,stop,setMute,decode,get cur(){return cur},get analyser(){return analyser}};
})();

function playPiece(p){
  const k='piece:'+p.id;if(Engine.cur&&Engine.cur.key===k){Engine.stop();return}
  Engine.play({key:k,title:L(p.title),sub:L(C(p.by).name)+' · '+typeLabel(p),bpm:p.bpm,root:KEYS[p.key],scale:p.scale,pieces:[p]});
}
function playPath(song,nodeId,muted){
  const k='song:'+song.id+':'+nodeId;if(Engine.cur&&Engine.cur.key===k&&!muted){Engine.stop();return}
  const path=pathTo(song,nodeId),root=P(path[0].piece);
  Engine.play({key:k,title:L(song.title),sub:path.length+' · '+path.map(x=>L(C(P(x.piece).by).name).split(' ')[0]).join(', '),bpm:root.bpm,root:KEYS[root.key],scale:root.scale,pieces:path.map(x=>P(x.piece)),muted:muted||[]});
}
const UI={
  raf:0,
  onPlay(spec){$('#player').hidden=false;$('#np-title').textContent=spec.title;$('#np-sub').textContent=spec.sub;markPlaying();cancelAnimationFrame(this.raf);this.draw()},
  onStop(){$('#player').hidden=true;cancelAnimationFrame(this.raf);markPlaying()},
  draw(){
    const cv=$('#eq'),g=cv.getContext('2d'),an=Engine.analyser;if(!an)return;const data=new Uint8Array(an.frequencyBinCount);
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const loop=()=>{an.getByteFrequencyData(data);g.clearRect(0,0,cv.width,cv.height);const bars=16,w=cv.width/bars;
      const grad=g.createLinearGradient(0,cv.height,0,0);grad.addColorStop(0,'#7C3AED');grad.addColorStop(.6,'#FF7AB8');grad.addColorStop(1,'#22D3EE');g.fillStyle=grad;
      for(let i=0;i<bars;i++){const v=reduce?.5:data[i+1]/255;const h=Math.max(4,v*cv.height);g.beginPath();g.roundRect?g.roundRect(i*w+2,cv.height-h,w-4,h,3):g.rect(i*w+2,cv.height-h,w-4,h);g.fill()}
      if(!reduce)this.raf=requestAnimationFrame(loop)};
    loop();
  }
};
function markPlaying(){
  const k=Engine.cur&&Engine.cur.key;
  document.querySelectorAll('[data-play-key]').forEach(el=>{const on=el.dataset.playKey===k;el.classList.toggle('on',on);el.innerHTML=on?IC.stop:IC.play;el.setAttribute('aria-label',on?'Stop':'Play');const card=el.closest('.piece');if(card)card.classList.toggle('playing',on)});
}

function drawWave(cv,amp=.5,animate=false){
  if(!cv)return;const g=cv.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let t=0;
  const frame=()=>{const W=cv.width,H=cv.height;g.clearRect(0,0,W,H);
    const bars=Math.floor(W/9);const grad=g.createLinearGradient(0,0,W,0);grad.addColorStop(0,'#FF7AB8');grad.addColorStop(.5,'#A78BFA');grad.addColorStop(1,'#22D3EE');g.fillStyle=grad;
    for(let i=0;i<bars;i++){const x=i/bars;const v=(Math.sin(x*9+t)*.5+.5)*(Math.sin(x*3.3-t*.7)*.5+.5)*.8+.12;const h=v*H*amp*1.6;g.globalAlpha=.35+v*.5;g.fillRect(i*9,H-h,5,h)}
    g.globalAlpha=1;if(animate&&!reduce&&document.body.contains(cv)){t+=.018;requestAnimationFrame(frame)}};
  frame();
}

function viewDiscover(){

let M={seed:null,dialect:'any',mood:'any',crew:null,idx:{},loading:false};
function candidates(seed,type,dialect,mood){
  const seedC=C(seed.by);
  return S.pieces.filter(p=>p.type===type&&p.id!==seed.id&&p.by!==seed.by).map(p=>{
    let sc=48;const why=[];
    if(p.key===seed.key&&p.scale===seed.scale){sc+=18;why.push(T('r_key')+` · ${p.key} ${T('s_'+p.scale)}`)}else if(p.scale===seed.scale){sc+=10;why.push(T('r_scale'))}
    const d=dialect==='any'?seed.dialect:dialect;if(p.dialect===d||(d==='khaliji'&&p.dialect!=='hijazi')){sc+=10;why.push(T('r_dialect')+` · ${T('d_'+p.dialect)}`)}
    const m=mood==='any'?seed.mood:[mood];const ov=p.mood.filter(x=>m.includes(x));if(ov.length){sc+=6*ov.length;why.push(T('r_mood')+` · ${ov.map(x=>T('m_'+x)).join(', ')}`)}
    if(Math.abs(p.bpm-seed.bpm)<=8){sc+=6;why.push(T('r_bpm')+` · ${p.bpm}→${seed.bpm}`)}
    if(CITIES[C(p.by).city].cc===CITIES[seedC.city].cc){sc+=3;why.push(T('r_city'))}
    if(p.likes>1000){sc+=Math.min(6,Math.log10(p.likes)*1.5);why.push(T('r_pop')+` · ♥ ${n(p.likes)}`)}
    return{p,score:Math.min(98,Math.round(sc)),why:why.slice(0,3)}}).sort((a,b)=>b.score-a.score);
}

function treeSVG(song,selId){
  const kids={};song.nodes.forEach(x=>{(kids[x.parent]=kids[x.parent]||[]).push(x)});
  const pos={};let leaf=0,maxD=0;
  (function place(nd,d){maxD=Math.max(maxD,d);const ch=kids[nd.id]||[];if(!ch.length){pos[nd.id]={d,y:leaf++};return}ch.forEach(c=>place(c,d+1));pos[nd.id]={d,y:ch.reduce((s,c)=>s+pos[c.id].y,0)/ch.length}})(song.nodes.find(x=>!x.parent),0);
  const NW=176,NH=58,GX=44,GY=16,W=(maxD+1)*(NW+GX)-GX+8,H=leaf*(NH+GY)-GY+8,rtl=S.lang==='ar';
  const X=d=>{const x=4+d*(NW+GX);return rtl?W-x-NW:x},Y=y=>4+y*(NH+GY);
  const inPath=new Set(pathTo(song,selId).map(x=>x.id));const lead=leadNode(song).id;
  let edges='',nodes='';
  song.nodes.forEach(nd=>{if(!nd.parent)return;const a=pos[nd.parent],b=pos[nd.id];
    const x1=rtl?X(a.d):X(a.d)+NW,y1=Y(a.y)+NH/2,x2=rtl?X(b.d)+NW:X(b.d),y2=Y(b.y)+NH/2,mx=(x1+x2)/2;
    edges+=`<path class="edge ${inPath.has(nd.id)?'in':''}" d="M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`});
  song.nodes.forEach(nd=>{const p=P(nd.piece),c=C(p.by),x=X(pos[nd.id].d),y=Y(pos[nd.id].y);
    const ttl=L(p.title),short=ttl.length>19?ttl.slice(0,18)+'…':ttl;const nm=L(c.name).split(' ')[0];
    const tx=rtl?x+NW-14:x+14,anchor=rtl?'end':'start',px=rtl?x+10:x+NW-10,panchor=rtl?'start':'end';
    nodes+=`<g class="tn ${inPath.has(nd.id)?'in':''} ${nd.id===selId?'sel':''}" data-act="node" data-song="${song.id}" data-node="${nd.id}" tabindex="0" role="button" aria-label="${esc(ttl)}">
      <rect class="bg" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="10"/><rect class="bar-${p.type}" x="${rtl?x+NW-5:x}" y="${y+8}" width="5" height="${NH-16}" rx="2.5"/>
      <text class="t" x="${tx}" y="${y+23}" text-anchor="${anchor}">${esc(short)}</text>
      <text class="s" x="${tx}" y="${y+42}" text-anchor="${anchor}">${esc(typeLabel(p))} · ${esc(nm)}</text>
      <text class="p" x="${px}" y="${y+42}" text-anchor="${panchor}">${nd.parent?'+'+pct(nd.share):T('root')}</text>
      <text class="s" x="${px}" y="${y+23}" text-anchor="${panchor}">${nd.id===lead?'★ ':''}♥${n(nd.likes+(isLiked(song.id+':'+nd.id)?1:0))}</text></g>`});
  return `<svg style="direction:ltr" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('tree')}">${edges}${nodes}</svg>`;
}

function spark(vals){const W=200,H=30,mx=Math.max(...vals),mn=Math.min(...vals),sx=i=>i/(vals.length-1)*(W-6)+3,sy=v=>H-4-(v-mn)/((mx-mn)||1)*(H-8);

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${d}L${sx(vals.length-1)} ${H}L${sx(0)} ${H}Z"/><path class="l" d="${d}"/><circle cx="${sx(vals.length-1)}" cy="${sy(vals[vals.length-1])}" r="3"/></svg>`}

   <div class="field"><span class="lbl">${T('type')}</span><div class="seg">${TYPES.map(t=>`<button type="button" class="c-${t} ${U.type===t?'on':''}" data-act="up-type" data-v="${t}">${IC[t]}<span style="color:var(--fg)">${T('t_'+t)}</span></button>`).join('')}</div></div>
   ${U.type==='instrument'?`<div class="field"><label for="u-inst">${T('inst')}</label><select class="input" id="u-inst">${['oud','qanun','perc','bass'].map(i=>`<option value="${i}" ${U.inst===i?'selected':''}>${T('i_'+i)}</option>`).join('')}</select></div>`:''}
   <div class="field"><label for="u-title">${T('title')}</label><input class="input" id="u-title" placeholder="${T('title_ph')}" required></div>
   ${isLyric?`<div class="field"><label for="u-lyr">${T('lyrics_lbl')}</label><textarea class="input" id="u-lyr" dir="rtl" placeholder="${T('lyrics_ph')}">يا بحر خذني لبعيد\nوين الهوى يرجع جديد</textarea></div>`
     :`<div class="field"><span class="lbl">${T('file')}</span><label class="drop" for="u-file"><input type="file" id="u-file" accept="audio/*">${IC.upload.replace('<svg','<svg width="24" height="24"')}<b id="u-fname">${U.file?esc(U.file.name):T('file_drop')}</b><span class="hint">${T('file_none')}</span></label></div>`}
   <div class="grid-3"><div class="field"><label for="u-bpm">${T('bpm')}</label><input class="input mono" id="u-bpm" type="number" min="60" max="180" value="96"></div>
     <div class="field"><label for="u-key">${T('key')}</label><select class="input" id="u-key">${Object.keys(KEYS).map(k=>`<option ${k==='D'?'selected':''}>${k}</option>`).join('')}</select></div>
     <div class="field"><label for="u-scale">${T('maqam')}</label><select class="input" id="u-scale">${Object.keys(SCALES).map(k=>`<option value="${k}">${T('s_'+k)}</option>`).join('')}</select></div></div>
   <div class="field"><label for="u-dia">${T('dialect')}</label><select class="input" id="u-dia">${DIALECTS.map(d=>`<option value="${d}" ${S.me.dialect===d?'selected':''}>${T('d_'+d)}</option>`).join('')}</select></div>
   <div class="field"><span class="lbl">${T('mood')}</span><div class="chips">${MOODS.map(m=>`<button type="button" class="chip ${U.moods.includes(m)?'on':''}" data-act="up-mood" data-v="${m}">${T('m_'+m)}</button>`).join('')}</div></div>
   <div class="field"><label for="u-open">${T('open_to')}</label><select class="input" id="u-open"><option value="both">${T('o_both')}</option><option value="remix">${T('o_remix')}</option><option value="ai">${T('o_ai')}</option></select></div>
   <div class="field"><label for="u-share">${T('min_share')}: <span class="mono" id="u-share-v">${U.share}%</span></label><input type="range" id="u-share" min="5" max="40" step="1" value="${U.share}"></div>
   <label class="check"><input type="checkbox" id="u-own"><span>${T('own')}</span></label>
   <span class="err" id="u-err" hidden></span>
   <button class="btn primary" type="submit" id="u-post">${IC.upload}${T('post')}</button>
  </form>
  <aside class="panel"><h3>${T('up_side_t')}</h3><p class="muted">${T('up_side')}</p><p class="note">${IC.lock.replace('<svg','<svg width="13" height="13" style="vertical-align:-2px"')} ${T('up_rules')}</p></aside></div></div>`;
}
after.upload=()=>{
  const f=$('#f-up');if(!f)return;
  const fi=$('#u-file');if(fi)fi.onchange=e=>{U.file=e.target.files[0]||null;$('#u-fname').textContent=U.file?U.file.name:T('file_drop')};
  const inst=$('#u-inst');if(inst)inst.onchange=e=>U.inst=e.target.value;
  $('#u-share').oninput=e=>{U.share=+e.target.value;$('#u-share-v').textContent=U.share+'%'};
  f.onsubmit=async e=>{e.preventDefault();const err=$('#u-err');const title=$('#u-title').value.trim();
    if(!title){err.textContent=T('title')+' ·  '+T('title_ph');err.hidden=false;return}
    if(!$('#u-own').checked){err.textContent=T('own');err.hidden=false;return}
    err.hidden=true;$('#u-post').disabled=true;
    const id='u'+Date.now().toString(36);const lyr=U.type==='lyric'?$('#u-lyr').value.trim():null;
    let bytes;if(U.file)bytes=await U.file.arrayBuffer();else bytes=new TextEncoder().encode(title+'|'+(lyr||'')+'|'+id);
    let hash='';try{const h=await crypto.subtle.digest('SHA-256',bytes);hash=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(x){hash=Array.from({length:64},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join('')}
    const p={id,type:U.type,by:'me',title:{en:title,ar:title},bpm:Math.max(60,Math.min(180,+$('#u-bpm').value||96)),key:$('#u-key').value,scale:$('#u-scale').value,dialect:$('#u-dia').value,mood:U.moods.length?[...U.moods]:['night'],seed:Math.floor(Math.random()*9000)+200,likes:0,plays:0,date:new Date().toISOString().slice(0,10),minShare:U.share/100,openTo:$('#u-open').value,hash};
    if(U.type==='beat')p.style=['trap','afro','rnb','khaleeji'][p.seed%4];
    if(U.type==='instrument')p.inst=U.inst;
    if(lyr)p.lyrics={ar:lyr,en:lyr};
    if(U.file){try{FILES[id]={buf:await Engine.decode(U.file)}}catch(x){}}
    S.pieces.unshift(p);save();
    U.done={id,hash,ts:new Date().toISOString().replace('T',' ').slice(0,19)+' UTC'};U.file=null;render();toast(T('posted'));
  };
};

/* ---------------- profile ---------------- */
function viewProfile(id){
  id=id||'me';const c=C(id);const mine=S.pieces.filter(p=>p.by===id);
  const on=S.songs.filter(s=>s.nodes.some(x=>P(x.piece).by===id));
  const likes=mine.reduce((a,p)=>a+p.likes,0);
  const shares=on.map(s=>{const sp=splits(pathTo(s,leadNode(s).id)).filter(x=>x.by===id);return{s,v:sp.reduce((a,b)=>a+b.pct,0)}});
  const avg=shares.length?shares.reduce((a,b)=>a+b.v,0)/shares.length:0;
  const tab=S.tab;
  return `<div class="wrap">
  <section class="band"><canvas id="bandwave" width="1400" height="240" aria-hidden="true"></canvas>
   <div class="prof-head">${av(id,'lg')}<div style="min-width:0"><h1>${esc(L(c.name))}</h1><p class="muted" style="margin-top:4px">${L(CITIES[c.city])} · ${c.roles.map(r=>T('t_'+r)).join(', ')} · ${T('joined')} ${dateF(c.joined)}</p><p style="margin-top:8px;max-width:60ch">${esc(L(c.bio))}</p></div></div>
   <div class="stats"><div class="stat"><b>${mine.length}</b><span>${T('prof_pieces')}</span></div><div class="stat"><b>${on.length}</b><span>${T('prof_songs')}</span></div><div class="stat"><b>${n(likes)}</b><span>${T('prof_likes')}</span></div><div class="stat"><b>${pct(avg)}</b><span>${T('prof_share')}</span></div></div>
  </section>
  <div class="tabs" role="tablist"><button class="${tab==='pieces'?'on':''}" data-act="tab" data-v="pieces">${T('prof_pieces')}</button><button class="${tab==='songs'?'on':''}" data-act="tab" data-v="songs">${T('prof_songs')}</button></div>
  ${tab==='pieces'?(mine.length?`<div class="pieces">${mine.map(pieceCard).join('')}</div>`:`<div class="panel"><p class="muted">${T('empty_pieces')}</p><a class="btn primary" href="#upload" style="align-self:flex-start">${IC.upload}${T('upload_first')}</a></div>`)
   :(shares.length?`<div class="list">${shares.map(({s,v})=>`<a class="card list-row" href="#song-${s.id}" style="text-decoration:none;color:var(--fg)"><div class="grow"><b>${esc(L(s.title))}</b><div class="hint">${T('p_'+s.path)} · ${s.nodes.length} ${T('versions')}</div></div>${stagePill(s.stage)}<span class="mono">${T('your_share')} ${pct(v)}</span></a>`).join('')}</div>`:`<div class="panel"><p class="muted">${T('empty_pieces')}</p></div>`)}
  ${id==='me'?`<div><button class="btn ghost sm" data-act="reset">${T('reset')}</button></div>`:''}
  </div>`;
}
after.profile=()=>drawWave($('#bandwave'),.45,true);

/* ---------------- modals ---------------- */
function openModal(html,onBind){$('#modal-box').innerHTML=html;$('#modal').hidden=false;onBind&&onBind($('#modal-box'));const f=$('#modal-box').querySelector('button,select,input');f&&f.focus()}
function closeModal(){$('#modal').hidden=true;$('#modal-box').innerHTML=''}
function modalHead(t,sub){return `<div class="modal-head"><div><h2>${t}</h2>${sub?`<p class="muted" style="margin-top:6px">${sub}</p>`:''}</div><button class="icon-btn" data-act="close" aria-label="${T('close')}">${IC.x}</button></div>`}

function useModal(pid){
  const p=P(pid);let choice='new';
  const songOpts=S.songs.map(s=>`<option value="${s.id}">${esc(L(s.title))}</option>`).join('');
  const verOpts=sid=>{const s=SG(sid);return s.nodes.map(x=>`<option value="${x.id}">${pathTo(s,x.id).map(y=>esc(L(P(y.piece).title))).join(' → ')}</option>`).join('')};
  openModal(`${modalHead(T('use_title'),esc(L(p.title))+' · '+typeLabel(p))}
   <div style="display:flex;flex-direction:column;gap:8px">
    <button class="opt on" data-c="new">${IC.songs.replace('<svg','<svg width="20" height="20"')}<div><b>${T('use_new')}</b><span>${T('use_new_sub')}</span></div></button>
    <button class="opt" data-c="ai">${IC.match.replace('<svg','<svg width="20" height="20"')}<div><b>${T('use_ai')}</b><span>${T('use_ai_sub')}</span></div></button>
    <button class="opt" data-c="add">${IC.branch.replace('<svg','<svg width="20" height="20"')}<div><b>${T('use_add')}</b><span>${T('use_add_sub')}</span></div></button>
   </div>
   <div id="use-add" hidden style="display:flex;flex-direction:column;gap:12px"><div class="field"><label for="ua-song">${T('pick_song')}</label><select class="input" id="ua-song">${songOpts}</select></div><div class="field"><label for="ua-ver">${T('pick_version')}</label><select class="input" id="ua-ver">${verOpts(S.songs[0].id)}</select></div></div>
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">${T('cancel')}</button><button class="btn primary" id="use-go">${T('go')}</button></div>`,box=>{
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{choice=b.dataset.c;box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));box.querySelector('#use-add').hidden=choice!=='add'});
    box.querySelector('#ua-song').onchange=e=>box.querySelector('#ua-ver').innerHTML=verOpts(e.target.value);
    box.querySelector('#use-go').onclick=()=>{
      if(choice==='ai'){closeModal();M={seed:pid,dialect:'any',mood:'any',crew:null,idx:{},loading:false};location.hash='match';return}
      if(choice==='new'){const s={id:'s'+Date.now().toString(36),title:{en:p.title.en,ar:p.title.ar},path:'community',stage:'open',plays:0,growth:[0,0,0,0,0,0,0.1],date:new Date().toISOString().slice(0,10),nodes:[{id:'n1',piece:pid,parent:null,share:1,likes:0}]};S.songs.unshift(s);save();closeModal();toast(T('song_started'));location.hash='song-'+s.id;return}
      const sid=box.querySelector('#ua-song').value,nid=box.querySelector('#ua-ver').value;closeModal();addLayerModal(sid,nid,pid);
    };
  });
}
function addLayerModal(sid,nid,preselect){
  const s=SG(sid);const base=pathTo(s,nid);const used=new Set(base.map(x=>x.piece));
  const mine=S.pieces.filter(p=>(p.by==='me'||p.id===preselect)&&!used.has(p.id));
  let pick=preselect&&!used.has(preselect)?preselect:(mine[0]&&mine[0].id)||'__new',share=.2,newType='melody';
  const preview=()=>{const nd={id:'__n',piece:pick==='__new'?'__tmp':pick,parent:nid,share};
    if(pick==='__new'){S.pieces.push({id:'__tmp',type:newType,inst:newType==='instrument'?'oud':undefined,by:'me',title:{en:$('#al-title')?.value||T('new_title_ph'),ar:$('#al-title')?.value||T('new_title_ph')},bpm:96,key:'D',scale:'hijaz',dialect:'khaliji',mood:[],seed:1})}
    const html=splitBlock(splits([...base,nd]),'__n');S.pieces=S.pieces.filter(p=>p.id!=='__tmp');return html};
  openModal(`${modalHead(T('add_title'),T('add_sub'))}
   <div class="note">${base.map(x=>esc(L(P(x.piece).title))).join(' → ')}</div>
   <div class="field"><span class="lbl">${T('choose_piece')}</span>${mine.length?'':`<p class="hint">${T('no_pieces')}</p>`}
    <div style="display:flex;flex-direction:column;gap:8px" id="al-list">${mine.map(p=>`<button type="button" class="opt ${pick===p.id?'on':''}" data-p="${p.id}">${tag(p)}<div><b>${esc(L(p.title))}</b><span class="mono">${metaLine(p)}</span></div></button>`).join('')}
    <button type="button" class="opt ${pick==='__new'?'on':''}" data-p="__new">${IC.upload.replace('<svg','<svg width="20" height="20"')}<div><b>${T('or_new')}</b><span>${T('file_none')}</span></div></button></div></div>
   <div id="al-new" ${pick==='__new'?'':'hidden'} class="grid-2"><div class="field"><label for="al-type">${T('type')}</label><select class="input" id="al-type">${TYPES.filter(t=>t!=='beat').map(t=>`<option value="${t}" ${t===newType?'selected':''}>${T('t_'+t)}</option>`).join('')}</select></div><div class="field"><label for="al-title">${T('title')}</label><input class="input" id="al-title" placeholder="${T('new_title_ph')}"></div></div>
   <div class="field"><label for="al-share">${T('share_ask')}: <span class="mono" id="al-share-v">${pct(share)}</span></label><input type="range" id="al-share" min="5" max="40" value="20"></div>
   <div id="al-split">${preview()}</div>
   <label class="check"><input type="checkbox" id="al-agree"><span>${T('agree')}</span></label>
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">${T('cancel')}</button><button class="btn primary" id="al-go" disabled>${IC.branch}${T('add_btn')}</button></div>`,box=>{
    const re=()=>box.querySelector('#al-split').innerHTML=preview();
    box.querySelector('#al-list').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;pick=b.dataset.p;box.querySelectorAll('#al-list .opt').forEach(x=>x.classList.toggle('on',x===b));box.querySelector('#al-new').hidden=pick!=='__new';re()};
    box.querySelector('#al-type').onchange=e=>{newType=e.target.value;re()};
    box.querySelector('#al-title').oninput=re;
    box.querySelector('#al-share').oninput=e=>{share=e.target.value/100;box.querySelector('#al-share-v').textContent=pct(share);re()};
    box.querySelector('#al-agree').onchange=e=>box.querySelector('#al-go').disabled=!e.target.checked;
    box.querySelector('#al-go').onclick=()=>{
      let pid=pick;const root=P(base[0].piece);
      if(pick==='__new'){pid='u'+Date.now().toString(36);const ttl=box.querySelector('#al-title').value.trim()||T('t_'+newType);
        const np={id:pid,type:newType,by:'me',title:{en:ttl,ar:ttl},bpm:root.bpm,key:root.key,scale:root.scale,dialect:S.me.dialect,mood:root.mood.slice(),seed:Math.floor(Math.random()*9000)+200,likes:0,plays:0,date:new Date().toISOString().slice(0,10)};
        if(newType==='instrument')np.inst=['oud','qanun','bass'][np.seed%3];if(newType==='lyric')np.lyrics={ar:'يا ليل خذني على هواك\nوخلّ القمر يشهد معاك',en:'Night, take me where you go\nAnd let the moon be our witness'};S.pieces.unshift(np)}
      const nn={id:'n'+Date.now().toString(36),piece:pid,parent:nid,share,likes:0};s.nodes.push(nn);S.sel[sid]=nn.id;save();closeModal();toast(T('added'));
      if(route().name==='song'&&route().id===sid)render();else location.hash='song-'+sid;
    };
  });
}
function offerModal(sid){
  const s=SG(sid),lead=leadNode(s),sp=splits(pathTo(s,lead.id));
  openModal(`${modalHead(T('offer_title'),T('offer_sub'))}
   <div class="row"><h3>${esc(L(s.title))}</h3>${pathTag(s.path)}</div>
   <div class="grid-2"><div class="field"><label for="of-label">${T('label_share')}</label><input class="input mono" id="of-label" type="number" min="0" max="90" placeholder="${T('label_ph')}"><span class="hint">${T('label_ph')}</span></div>
   <div class="field"><label for="of-adv">${T('advance')}</label><input class="input mono" id="of-adv" type="number" min="0" step="1000" value="15000"></div></div>
   <div><div class="eyebrow" style="margin-bottom:8px">${T('creator_pool')}</div>${splitBlock(sp)}</div>
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">${T('cancel')}</button><button class="btn primary" id="of-go">${T('send_offer')}</button></div>`,box=>{
    box.querySelector('#of-go').onclick=()=>{s.stage='offer';save();closeModal();toast(T('offer_sent'));render()};
  });
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,d=el.dataset;
  if(a==='lang'){S.lang=S.lang==='en'?'ar':'en';save();render();return}
  if(a==='guest'){S.me={name:T('guest_name'),roles:['beat'],city:'dubai',dialect:'emirati',joined:new Date().toISOString().slice(0,10)};save();location.hash='discover';render();return}
  if(a==='close'){closeModal();return}
  if(a==='play-piece'){e.preventDefault();playPiece(P(d.id));return}
  if(a==='play-path'){playPath(SG(d.song),d.node,muted['song:'+d.song+':'+d.node]);return}
  if(a==='like'){const k=d.k;S.liked=isLiked(k)?S.liked.filter(x=>x!==k):[...S.liked,k];save();
    if(route().name==='song'||route().name==='ar')render();else{const on=isLiked(k);el.classList.toggle('on',on);if(d.piece){const p=P(d.piece);el.innerHTML=IC.heart+n(p.likes+(on?1:0))}}if(isLiked(k))toast(T('liked'));return}
  if(a==='ftype'){S.filter.type=d.v;save();render();return}
  if(a==='use'){useModal(d.id);return}
  if(a==='node'){S.sel[d.song]=d.node;save();const k='song:'+d.song+':'+d.node;render();if(Engine.cur&&Engine.cur.key.startsWith('song:'+d.song))playPath(SG(d.song),d.node,muted[k]);return}
  if(a==='add-layer'){addLayerModal(d.song,d.node);return}
  if(a==='mute'){const k='song:'+d.song+':'+d.node,i=+d.i;const m=muted[k]||[];muted[k]=m.includes(i)?m.filter(x=>x!==i):[...m,i];
    if(Engine.cur&&Engine.cur.key===k)Engine.setMute(i,muted[k].includes(i));render();return}
  if(a==='swap'){M.idx[d.t]=(M.idx[d.t]||0)+1;render();return}
  if(a==='crew-play'){const crew=currentCrew(),seed=crew[0];if(Engine.cur&&Engine.cur.key==='crew'){Engine.stop();return}
    Engine.play({key:'crew',title:T('crew'),sub:crew.map(p=>L(C(p.by).name).split(' ')[0]).join(', '),bpm:seed.bpm,root:KEYS[seed.key],scale:seed.scale,pieces:crew});return}
  if(a==='crew-start'){const crew=currentCrew();const s={id:'s'+Date.now().toString(36),title:{en:crew[0].title.en,ar:crew[0].title.ar},path:'ai',stage:'open',plays:0,growth:[0,0,0,0,0,0,.1],date:new Date().toISOString().slice(0,10),nodes:[]};
    let parent=null;crew.forEach((p,i)=>{const id='n'+(i+1);s.nodes.push({id,piece:p.id,parent,share:i?DEFAULT_SHARE[p.type]:1,likes:0});parent=id});
    S.songs.unshift(s);save();M.crew=null;toast(T('crew_started'));location.hash='song-'+s.id;return}
  if(a==='advance'){const s=SG(d.id);if(s.stage==='review'){offerModal(d.id);return}
    s.stage=s.stage==='rising'||s.stage==='open'?'review':s.stage==='offer'?'signed':s.stage;save();render();toast(s.stage==='signed'?T('signed_t'):T('moved')+' '+T('st_'+s.stage));return}
  if(a==='pass'){const s=SG(d.id);s.stage='open';save();render();toast(T('passed'));return}
  if(a==='up-type'){U.type=d.v;render();return}
  if(a==='up-mood'){U.moods=U.moods.includes(d.v)?U.moods.filter(x=>x!==d.v):[...U.moods,d.v];el.classList.toggle('on');return}
  if(a==='up-again'){U.done=null;render();return}
  if(a==='match-from'){M={seed:d.id,dialect:'any',mood:'any',crew:null,idx:{},loading:false};U.done=null;location.hash='match';return}
  if(a==='tab'){S.tab=d.v;save();render();return}
  if(a==='reset'){Engine.stop();const lang=S.lang,me=S.me;S=fresh();S.lang=lang;S.me=me;save();render();toast(T('reset_done'));return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.tn')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#np-stop').innerHTML=IC.stop;$('#np-stop').onclick=()=>Engine.stop();
render();
</script>
